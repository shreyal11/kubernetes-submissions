apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: ping-pong:2.7
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: pingpong
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              value: postgres
          ports:
            - containerPort: 8000

