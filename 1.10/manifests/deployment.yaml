apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-log
          emptyDir: {}

      containers:
        - name: log-generator
          image: log-output:1.10
          command: ["python3", "generator.py"]
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files

        - name: log-reader
          image: log-output:1.10
          command: ["python3", "reader.py"]
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
